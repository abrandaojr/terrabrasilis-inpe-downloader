[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrabrasilis-inpe-downloader"
version = "1.2.0"
description = "Portable PRODES/TerraBrasilis pipeline for downloading, converting, validating, and presenting INPE deforestation data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Amintas Brandao Jr", email = "abrandaojr@gmail.com" }
]
keywords = [
  "prodes",
  "terrabrasilis",
  "inpe",
  "geoparquet",
  "deforestation",
  "brazil",
  "geospatial"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tqdm>=4.66",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "pyarrow>=17.0",
  "shapely>=2.0",
  "numpy>=1.26",
  "rasterio>=1.3",
  "matplotlib>=3.9",
  "python-pptx>=1.0",
  "pandas>=2.0",
  "duckdb>=1.1",
  "openpyxl>=3.1"
]

[project.urls]
Homepage = "https://github.com/abrandaojr/terrabrasilis-inpe-downloader"
Repository = "https://github.com/abrandaojr/terrabrasilis-inpe-downloader"
Issues = "https://github.com/abrandaojr/terrabrasilis-inpe-downloader/issues"
TerraBrasilis = "https://terrabrasilis.dpi.inpe.br/en/download-files/"

[tool.setuptools]
packages = ["prodes_pipeline"]
